version: "3.7"

services:
  catalogo3d:
    image: python:3.11-slim
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    command:
      - /bin/bash
      - -c
      - |
        apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
        if [ ! -d "/app/.git" ]; then
          git clone https://github.com/anascimento18/catalogo3d.git /app
        else
          cd /app && git pull
        fi
        cd /app
        pip install --no-cache-dir -r requirements.txt
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - network_swarm_public
    volumes:
      - catalogo3d_data:/data
      - telegram_bot_data:/var/lib/telegram-bot-api
    environment:
      - DATA_DIR=/data
      # Conexão com o PostgreSQL interno do Swarm
      - DATABASE_URL=postgresql://postgres:Anascimento2025Antonio@postgreslink:5432/postgres
      
      # Segurança e Acesso Administrativo
      - ADMIN_USERNAME=andre
      - ADMIN_PASSWORD=3aField@2026
      - ADMIN_ROUTE=/loginAdmin
      - SECRET_KEY=b98f2c31e405a6d7c8e9fa0123456789abcdef0123456789abcdef0123456789
      
      # Destino das Notificações
      - DEST_WHATSAPP=5565992217557
      - CATALOG_DOMAIN=https://catalogo3d.3afieldservice.com.br
      
      # Integração com n8n e Evolution API
      - N8N_WEBHOOK_URL=https://hookncst.3afieldservice.com.br/webhook/catalogo-pedido
      - EVOLUTION_URL=https://evowsapi.3afieldservice.com.br
      - EVOLUTION_KEY=4eddc4b3-5499-47a1-9b8b-d4afa9ad00e8
      - EVOLUTION_INSTANCE=andre
      
      # Ingestão Automática via Telegram Bot (API Local até 2 GB)
      - TELEGRAM_BOT_TOKEN=8856055764:AAF5PxZzZ6y9GHgCGr-t6apEtQkPKFDfGsM
      - TELEGRAM_ADMIN_CHAT_ID=613898449,5370959021438146805
      - TELEGRAM_API_SERVER=http://telegram-bot-api:8081
      
      # Performance e Logs em Tempo Real
      - PYTHONUNBUFFERED=1
      - DEBIAN_FRONTEND=noninteractive

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == worker02
      resources:
        limits:
          cpus: "1"
          memory: 512M
      labels:
        # Configuração do Traefik para SSL automático
        - traefik.enable=true
        - traefik.http.routers.catalogo3d.rule=Host(`catalogo3d.3afieldservice.com.br`)
        - traefik.http.routers.catalogo3d.entrypoints=websecure
        - traefik.http.routers.catalogo3d.tls.certresolver=letsencryptresolver
        - traefik.http.routers.catalogo3d.service=catalogo3d
        - traefik.http.services.catalogo3d.loadbalancer.server.port=8000
        - traefik.http.services.catalogo3d.loadbalancer.passHostHeader=true

  # Servidor Oficial da API do Telegram (Suporte a uploads e downloads de até 2.000 MB)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    environment:
      - TELEGRAM_API_ID=20030224
      - TELEGRAM_API_HASH=f18906f67faf98ee956f2550d53ef864
      - TELEGRAM_LOCAL=1
      - TELEGRAM_STAT=1
    volumes:
      - telegram_bot_data:/var/lib/telegram-bot-api
    networks:
      - network_swarm_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == worker02
      resources:
        limits:
          cpus: "1"
          memory: 1024M

volumes:
  catalogo3d_data:
  telegram_bot_data:

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
